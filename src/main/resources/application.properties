spring.application.name=spring-AI
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}
spring.ai.model.chat=ollama
spring.ai.ollama.chat.options.model=llama3.1:8b
#make sure this version use for Tools
#spring.ai.ollama.chat.options.model=llama3.1:8b
spring.ai.ollama.chat.options.temperature=0.1

#H2 Database and JDBC related
spring.datasource.url=jdbc:h2:file:D:/h2-database-spring-ai;AUTO_SERVER=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.ai.chat.memory.repository.jdbc.initialize-schema=always
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#Docker Related
spring.docker.compose.stop.command=down

#Quadrent Related
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=learn-spring-ai